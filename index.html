<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Naneice Desk | Dr. Naneice Elshimy</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Poppins:wght@600;700&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--L:#8B6AAC;--Ld:#6B4F8A;--Ls:#EDE4F7;--cream:#FBF7F2;--ink:#2A2433;--muted:#7A7385;--lavender:#C9B4EB;--peach:#F7DFC9;--pink:#F2B9C6}
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Nunito,sans-serif;color:var(--ink);min-height:100vh;background:radial-gradient(ellipse at 0% 0%,rgba(139,106,172,.22),transparent 45%),radial-gradient(ellipse at 100% 0%,rgba(201,180,235,.25),transparent 40%),radial-gradient(ellipse at 90% 100%,rgba(247,223,201,.3),transparent 40%),var(--cream)}
h1,h2,h3{font-family:Poppins,Tajawal,sans-serif;margin:0}
.btn{border:0;border-radius:999px;padding:.6rem 1rem;font-weight:800;cursor:pointer;font-family:inherit;font-size:.88rem;display:inline-flex;align-items:center;gap:.35rem}
.bp{background:linear-gradient(135deg,var(--L),var(--Ld));color:#fff;box-shadow:0 8px 16px -10px rgba(107,79,138,.5)}
.bo{background:#fff;border:1.5px solid rgba(139,106,172,.28);color:var(--Ld)}
.bd{background:#fff;border:1.5px solid #f5c2c7;color:#c23b4d}
.bg{background:#3da978;color:#fff}
input,select,textarea{width:100%;border:1.5px solid rgba(139,106,172,.25);border-radius:.9rem;padding:.65rem .85rem;margin-top:.3rem;font-family:inherit}
label{display:block;font-weight:700;font-size:.88rem;margin-top:.7rem}
.muted{color:var(--muted);font-size:.85rem}
.kicker{display:inline-flex;background:var(--Ls);color:var(--Ld);border-radius:999px;padding:.2rem .7rem;font-size:.7rem;font-weight:800}
.wrap{min-height:100vh;display:grid;place-items:center;padding:1.2rem;position:relative;overflow:hidden}
.wrap::before{content:"";position:absolute;width:240px;height:240px;background:var(--lavender);border-radius:50%;top:-50px;left:-50px;opacity:.5}
.wrap::after{content:"";position:absolute;width:200px;height:200px;background:var(--peach);border-radius:50%;bottom:-40px;right:-30px;opacity:.5}
.card{width:100%;max-width:420px;background:rgba(255,255,255,.94);border:1px solid rgba(139,106,172,.16);border-radius:1.75rem;padding:1.6rem;box-shadow:0 12px 32px -18px rgba(107,79,138,.28);position:relative;z-index:1;text-align:center}
.logo{width:64px;height:64px;margin:0 auto .8rem;border-radius:1.2rem;background:linear-gradient(145deg,var(--Ls),#fff);border:1px solid rgba(139,106,172,.2);display:grid;place-items:center;font-size:1.5rem}
.app{display:grid;min-height:100vh}@media(min-width:960px){.app{grid-template-columns:250px 1fr}}
.side{background:linear-gradient(180deg,#6B4F8A,#5A4175 55%,#4A3562);color:#fff;padding:1rem}
.side .name{font-family:Poppins,sans-serif;font-weight:700;font-size:1.1rem}
.side .sub{font-size:.72rem;opacity:.8}.side .teacher{font-size:.82rem;margin:.5rem 0 .9rem;font-weight:600}
.side nav{display:flex;flex-wrap:wrap;gap:.25rem}@media(min-width:960px){.side nav{flex-direction:column;flex-wrap:nowrap}}
.side button{display:block;width:100%;text-align:right;background:0;border:0;color:#fffe;font:inherit;font-weight:700;padding:.65rem .8rem;border-radius:.9rem;cursor:pointer;white-space:nowrap}
.side button.on,.side button:hover{background:rgba(255,255,255,.12)}.side button.on{background:#fff;color:var(--Ld)}
.main{padding:1.1rem 1.2rem 2rem}
.hero{background:linear-gradient(135deg,#fff,var(--Ls));border:1px solid rgba(139,106,172,.12);border-radius:1.5rem;padding:1.15rem 1.25rem;box-shadow:0 10px 28px -18px rgba(107,79,138,.22)}
.grid{display:grid;gap:.9rem}@media(min-width:700px){.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}}
.metric{background:#fff;border-radius:1.25rem;padding:.95rem;border:1px solid rgba(139,106,172,.1);box-shadow:0 10px 28px -18px rgba(107,79,138,.2);position:relative;overflow:hidden}
.metric::before{content:"";position:absolute;inset-inline:0;top:0;height:4px;background:linear-gradient(90deg,var(--L),var(--lavender),var(--pink))}
.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--Ls);margin-bottom:.45rem;font-size:1.1rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.item{background:#fff;border:1px solid rgba(139,106,172,.12);border-radius:1.1rem;padding:.9rem}
.badge{border-radius:999px;padding:.18rem .6rem;font-size:.7rem;font-weight:800}
.ok{background:#d8f3e7;color:#1f7a55}.warn{background:#fff0d6;color:#a16207}.bad{background:#ffe4e8;color:#b4233a}.info{background:var(--Ls);color:var(--Ld)}
.alert{border-radius:1.1rem;padding:.9rem;display:flex;gap:.6rem;align-items:flex-start}
.alert-warn{background:linear-gradient(135deg,#fff8eb,#fff);border:1px solid #f5d59a}
.alert-bad{background:linear-gradient(135deg,#fff1f3,#fff);border:1px solid #f3b4bc}
.modal{position:fixed;inset:0;background:rgba(42,36,51,.42);display:grid;place-items:center;padding:1rem;z-index:50}
.sheet{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:#fff;border-radius:1.4rem;padding:1.2rem}
.actions{display:flex;gap:.4rem;flex-wrap:wrap}
.footer{text-align:center;margin-top:1.4rem;padding-top:.9rem;border-top:1px dashed rgba(139,106,172,.22);color:var(--muted);font-size:.75rem}
.footer strong{color:var(--Ld)}
.table{width:100%;border-collapse:collapse;font-size:.88rem}
.table th,.table td{padding:.55rem .4rem;border-bottom:1px solid rgba(139,106,172,.1);text-align:right}
.table th{color:var(--Ld);font-weight:800}
.pos{color:#1f7a55;font-weight:800}.neg{color:#b4233a;font-weight:800}
</style>
</head>
<body>
<div id="root"></div>
<script src="/app.js"></script>
<script src="/ui.js"></script>
</body>
</html>
